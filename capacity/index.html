<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Appointment capacity calendar for the SYR, WCH and BOH sales branches.">
<!-- Where the shared-storage function answers. Change this if you route the
     function somewhere else; nothing else in the page needs editing. -->
<meta name="capacity-api" content="/api/capacity-state">
<title>RI Capacity Calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%93%EF%B8%8F%3C/text%3E%3C/svg%3E">

<style>
/* ============================== TOKENS ============================== */
:root{
  --ground:#EDF1F6;
  --surface:#FFFFFF;
  --surface-2:#F5F8FB;
  --surface-3:#E7EDF4;
  --line:#D7DFEA;
  --line-strong:#B9C6D7;
  --ink:#16202F;
  --ink-2:#4C5C72;
  --ink-3:#7E8DA2;
  --std:#1F7A8C;
  --std-ink:#FFFFFF;
  --std-soft:#DBEBEF;
  --std-edge:#A9CFD7;
  --prime:#B9722A;
  --prime-ink:#FFFFFF;
  --prime-soft:#F7E8D6;
  --prime-edge:#E3C199;
  --ok:#3C7F5B;
  --ok-soft:#E0EFE7;
  --warn:#B07A21;
  --warn-soft:#F6EBD4;
  --crit:#A94436;
  --crit-soft:#F6E1DD;
  --shadow:0 1px 2px rgba(20,32,48,.06), 0 8px 24px -12px rgba(20,32,48,.18);
  --shadow-lg:0 2px 4px rgba(20,32,48,.08), 0 24px 48px -18px rgba(20,32,48,.28);
  color-scheme:light;
  --crit-ink:#FFFFFF;
  --off-bg:#E3E8EF;
  --off-line:#C6CFDB;
  --blk-bg:#DCE3EE;
  --blk-edge:#AFBDD0;
  --blk-ink:#5A6B82;
  --tint:rgba(20,32,48,.06);
  --r:8px;
  --r-lg:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D131C;
    --surface:#151E29;
    --surface-2:#1B2733;
    --surface-3:#22303E;
    --line:#28364A;
    --line-strong:#3A4B62;
    --ink:#E4EAF2;
    --ink-2:#A5B3C6;
    --ink-3:#77879D;
    --std:#4FB6C9;
    --std-ink:#07242B;
    --std-soft:#12333C;
    --std-edge:#2C5F6C;
    --prime:#E0A163;
    --prime-ink:#2A1808;
    --prime-soft:#2C2014;
    --prime-edge:#6B4C24;
    --ok:#63B489;
    --ok-soft:#153026;
    --warn:#D9A445;
    --warn-soft:#33280F;
    --crit:#D4705F;
    --crit-soft:#361D18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -18px rgba(0,0,0,.7);
    color-scheme:dark;
    --crit-ink:#2A1210;
    --off-bg:#1C2634;
    --off-line:#2B3949;
    --blk-bg:#202D3E;
    --blk-edge:#35465C;
    --blk-ink:#93A3B8;
    --tint:rgba(255,255,255,.10);
  }
}
:root[data-theme="dark"]{
  --ground:#0D131C;
  --surface:#151E29;
  --surface-2:#1B2733;
  --surface-3:#22303E;
  --line:#28364A;
  --line-strong:#3A4B62;
  --ink:#E4EAF2;
  --ink-2:#A5B3C6;
  --ink-3:#77879D;
  --std:#4FB6C9;
  --std-ink:#07242B;
  --std-soft:#12333C;
  --std-edge:#2C5F6C;
  --prime:#E0A163;
  --prime-ink:#2A1808;
  --prime-soft:#2C2014;
  --prime-edge:#6B4C24;
  --ok:#63B489;
  --ok-soft:#153026;
  --warn:#D9A445;
  --warn-soft:#33280F;
  --crit:#D4705F;
  --crit-soft:#361D18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -18px rgba(0,0,0,.7);
    color-scheme:dark;
    --crit-ink:#2A1210;
    --off-bg:#1C2634;
    --off-line:#2B3949;
    --blk-bg:#202D3E;
    --blk-edge:#35465C;
    --blk-ink:#93A3B8;
    --tint:rgba(255,255,255,.10);
}

/* ============================== BASE ============================== */
*{box-sizing:border-box;}
/* The gate and the app are both laid out with flex, and a bare `display:flex`
   further down the sheet would otherwise beat the browser's own rule for
   [hidden] — leaving whichever one is meant to be put away still taking up a
   screenful of space above the other. */
[hidden]{display:none !important;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
:focus-visible{outline:2px solid var(--std);outline-offset:2px;border-radius:4px;}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}
.eyebrow{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}
h1,h2,h3{font-family:"Archivo",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.015em;}

/* ============================== SHELL ============================== */
.app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:12px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
.brand h1{font-size:16px;font-weight:700;white-space:nowrap;}
.qpick{
  display:inline-flex;align-items:center;gap:1px;
  border:1px solid var(--line);border-radius:99px;background:var(--surface-2);padding:1px;
}
.qpick select{
  border:none;background:transparent;font-size:11.5px;font-weight:500;color:var(--ink);
  padding:3px 4px;border-radius:99px;cursor:pointer;appearance:none;text-align:center;
}
.qpick select:hover{background:var(--surface-3);}
.qnav{
  width:20px;height:20px;border-radius:99px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
}
.qnav:hover:not(:disabled){background:var(--surface-3);color:var(--ink);}
.qnav:disabled{opacity:.3;cursor:default;}
.wtag{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);
  border-radius:99px;padding:1px 7px;white-space:nowrap;
}
.spacer{flex:1 1 auto;}

.railbtn{
  display:none;align-items:center;gap:7px;
  border:1px solid var(--line-strong);background:var(--surface);
  padding:6px 12px;border-radius:99px;max-width:52vw;
}
.railbtn-who{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:12.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.railbtn-caret{color:var(--ink-3);font-size:10px;line-height:1;}
.rail .railseg{display:none;margin:12px 14px 4px;}
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.42);z-index:44;}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px;}
.seg button{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;letter-spacing:.06em;
  padding:6px 14px;border-radius:6px;color:var(--ink-2);transition:background .12s,color .12s;
}
.seg button:hover{color:var(--ink);}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.seg button .cnt{font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10px;color:var(--ink-3);margin-left:6px;}
/* The company switcher is the outer choice: darker when active, so the branch
   row beside it reads as living inside whatever is picked here. */
.seg.co button[aria-pressed="true"]{background:var(--ink);color:var(--ground);}
.seg.co button[aria-pressed="true"] .cnt{color:var(--ground);opacity:.65;}
.seg.co button{letter-spacing:.02em;}

.savebox{display:flex;align-items:center;gap:10px;}
.savestate{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.savestate .dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:none;}
.savestate.dirty .dot{background:var(--warn);}
.savestate.err .dot{background:var(--crit);}
.savestate.ro .dot{background:var(--ink-3);}

.btn{
  border:1px solid var(--line-strong);background:var(--surface);
  padding:7px 14px;border-radius:var(--r);font-weight:500;font-size:13px;
  transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.45;cursor:default;}
.btn.primary{background:var(--std);border-color:var(--std);color:var(--std-ink);font-weight:600;}
.btn.primary:hover{filter:brightness(1.07);background:var(--std);}
.btn.sm{padding:4px 10px;font-size:12px;}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);}
.btn.danger:hover{background:var(--crit-soft);}

/* ============================== BODY GRID ============================== */
.main{display:grid;grid-template-columns:264px minmax(0,1fr);flex:1 1 auto;align-items:start;}
@media (max-width:900px){ .main{grid-template-columns:1fr;} }

/* ---------- roster rail ---------- */
.rail{
  border-right:1px solid var(--line);background:var(--surface);
  position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto;
  display:flex;flex-direction:column;
}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr);}
  .rail{
    position:fixed;left:0;top:0;bottom:0;z-index:45;width:min(320px,86vw);max-height:none;
    border-right:1px solid var(--line);box-shadow:var(--shadow-lg);
    transform:translateX(-100%);transition:transform .18s ease;
  }
  .rail.open{transform:none;}
  .rail .railseg{display:flex;}
  .railbtn{display:inline-flex;}
  .topbar .seg:not(.railseg){display:none;}
  .topbar{padding:9px 12px;gap:10px;}
  .brand h1{font-size:14px;}
  .content{padding:14px 12px 48px;}
  .dchip{padding:7px 15px;font-size:12.5px;}
  .months button{padding:7px 15px;}
}
@media (min-width:901px){ .scrim{display:none;} }
.rail-head{padding:14px 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.rail-search{padding:0 14px 10px;}
.rail-search input{
  width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface-2);font-size:13px;
}
.rail-search input::placeholder{color:var(--ink-3);}
.roster{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column;gap:1px;}
.rep{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;
  padding:2px 4px 2px 8px;border-radius:var(--r);
  border:1px solid transparent;transition:background .1s;
}
.rep:hover{background:var(--surface-2);}
.rep[aria-current="true"]{background:var(--std-soft);border-color:var(--std-edge);}
.repmain{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;
  width:100%;text-align:left;padding:6px 4px;border-radius:6px;min-width:0;
}
.rep .nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rep[aria-current="true"] .nm{font-weight:600;}
.pips{display:flex;gap:3px;}
.pip{width:6px;height:6px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line);}
.pip.ok{background:var(--ok);border-color:var(--ok);}
.pip.warn{background:var(--warn);border-color:var(--warn);}
.pip.crit{background:var(--crit);border-color:var(--crit);}
.repmenu{opacity:0;color:var(--ink-3);padding:2px 4px;border-radius:4px;line-height:1;font-size:15px;}
.rep:hover .repmenu,.rep:focus-within .repmenu{opacity:1;}
.repmenu:hover{background:var(--surface-3);color:var(--ink);}
.rail-add{padding:10px 14px 16px;border-top:1px solid var(--line);margin-top:auto;display:flex;flex-direction:column;gap:8px;}
.rail-add input{
  width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
}
.rail-empty{padding:18px 16px;color:var(--ink-3);font-size:12.5px;line-height:1.6;}

/* ---------- content ---------- */
.content{padding:18px 20px 60px;min-width:0;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tabs button{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.02em;
  padding:9px 14px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink);}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--std);}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.pagehead h2{font-size:20px;font-weight:700;}
.pagehead .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px;}

/* month tabs */
.months{display:flex;gap:6px;flex-wrap:wrap;}
.months button{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;
  border:1px solid var(--line);border-radius:99px;padding:5px 14px;color:var(--ink-2);background:var(--surface);
}
.months button:hover{border-color:var(--line-strong);color:var(--ink);}
.months button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);}
.mdot{
  width:6px;height:6px;border-radius:99px;display:inline-block;margin-left:7px;
  background:var(--surface-3);border:1px solid var(--line-strong);vertical-align:middle;
}
.mdot.ok{background:var(--ok);border-color:var(--ok);}
.mdot.warn{background:var(--warn);border-color:var(--warn);}
.months button[aria-pressed="true"] .mdot{border-color:var(--ground);}

/* always-visible key, instead of one buried under five week bands */
.panel{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:12px;
}
.panel > summary{
  list-style:none;cursor:pointer;padding:9px 16px;display:flex;align-items:center;gap:10px;
  font-family:"Archivo",sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
}
.panel > summary::-webkit-details-marker{display:none;}
.panel > summary:hover{color:var(--ink);}
.panel > summary::after{content:"▾";margin-left:auto;font-size:11px;transition:transform .15s;}
.panel[open] > summary::after{transform:rotate(180deg);}
.panel > summary .sumnote{
  font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:11.5px;
  letter-spacing:0;text-transform:none;color:var(--ink-3);
}
.panel .body{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:0 16px 11px;}
.wm .need{font-size:11px;color:var(--warn);white-space:nowrap;}

/* month summary strip */
.msum{
  display:flex;gap:22px;flex-wrap:wrap;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow);
}
.msum .grow{flex:1 1 220px;min-width:200px;}
.bigstat{display:flex;align-items:baseline;gap:8px;}
.bigstat .v{font-family:"Archivo",sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.bigstat .of{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:7px;position:relative;}
.meter i{display:block;height:100%;border-radius:99px;transition:width .25s ease;}
.meter i.ok{background:var(--ok);}
.meter i.warn{background:var(--warn);}
.meter i.std{background:var(--std);}
.meter i.prime{background:var(--prime);}
.tick{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--ink-3);opacity:.55;}

/* ---------- week band ---------- */
.week{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);
}
.week-head{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
}
.week-title{display:flex;align-items:baseline;gap:9px;}
.week-title .n{font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;}
.week-title .rng{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);}
.wmeters{display:flex;gap:16px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.wm{display:flex;align-items:center;gap:8px;}
.wm .lbl{font-family:"Archivo",sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
.wm .val{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
.wm .val.ok{color:var(--ok);}
.wm .val.warn{color:var(--warn);}
.wm .val.zero{color:var(--ink-3);}
.wm .bar{width:64px;}
.wactions{display:flex;gap:4px;}

.grid{overflow-x:auto;}
.gridin{min-width:640px;padding:0 0 2px;}
.grow7{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));}
.dayhead{
  padding:8px 6px 7px;text-align:center;border-bottom:1px solid var(--line);
  border-left:1px solid var(--line);width:100%;display:block;
  transition:background .12s,box-shadow .12s;
}
button.dayhead:not(:disabled){cursor:pointer;}
button.dayhead:not(:disabled):hover{background:var(--surface-3);box-shadow:inset 0 -2px 0 var(--line-strong);}
button.dayhead.wknd:not(:disabled):hover{background:color-mix(in srgb,var(--prime-soft) 80%,var(--surface-3));}
button.dayhead.off:not(:disabled):hover{background:var(--off-line);}
button.dayhead:disabled{cursor:default;}
.dayhead:first-child{border-left:none;}
.dayhead .dw{font-family:"Archivo",sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.dayhead .dd{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:500;margin-top:1px;}
.dayhead.wknd{background:var(--prime-soft);}
.dayhead.wknd .dw{color:var(--prime);}
.corner{border-bottom:1px solid var(--line);position:sticky;left:0;z-index:3;background:var(--surface);}

.slotlbl{
  display:flex;align-items:center;justify-content:flex-end;padding-right:9px;
  font-family:"Archivo",sans-serif;font-weight:600;font-size:10px;letter-spacing:.09em;
  color:var(--ink-3);border-bottom:1px solid var(--line);height:38px;
  position:sticky;left:0;z-index:3;background:var(--surface);
}
.row-pm .slotlbl{color:var(--prime);}
.cellwrap{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;height:38px;}
.cell{
  width:100%;height:100%;border-radius:5px;border:1px solid var(--line);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  position:relative;transition:background .1s,border-color .1s,color .1s;
}
.cell{touch-action:pan-y;}
.cell:hover{border-color:var(--line-strong);background:var(--surface-3);}
.cell.prime{background:color-mix(in srgb,var(--prime-soft) 55%,var(--surface-2));border-color:var(--prime-edge);}
.cell.prime:hover{background:color-mix(in srgb,var(--prime-soft) 85%,var(--surface-2));}
.cell.on{background:var(--std);border-color:var(--std);color:var(--std-ink);}
.cell.on:hover{background:var(--std);filter:brightness(1.08);}
.cell.on.prime{background:var(--prime);border-color:var(--prime);color:var(--prime-ink);}
.cell.on.prime:hover{background:var(--prime);filter:brightness(1.08);}
.cell .mk{font-family:"Archivo",sans-serif;font-weight:700;font-size:12px;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s;}
.cell.on .mk{opacity:1;transform:scale(1);}
.cell[disabled]{cursor:default;opacity:.75;}
.readonly .cell{cursor:default;}

.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2);}

var UI_KEY = "ri-capacity-calendar/ui";

function $(sel,root){ return (root||document).querySelector(sel); }
function el(tag,cls,txt){ var n=document.createElement(tag); if(cls) n.className=cls; if(txt!=null) n.textContent=txt; return n; }
function parseDate(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtISO(d){
  var m=d.getMonth()+1, day=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function shortDate(d){ return MON[d.getMonth()]+" "+d.getDate(); }
function slotKey(iso,slot){ return iso+"|"+slot; }
function isPrime(iso,slot){ var dw=parseDate(iso).getDay(); return dw===0||dw===6||slot==="PM"; }
/* Two ways a day can be off: a weekday blocked every week, or one specific date. */
function isRecurringOff(rep,iso){ return !!(rep.daysOff && rep.daysOff[parseDate(iso).getDay()]); }
function isDateOff(rep,iso){ return !!(rep.dateOff && rep.dateOff[iso]); }
function isOffDay(rep,iso){ return isRecurringOff(rep,iso) || isDateOff(rep,iso); }
/* single dates the rep has blocked inside one quarter, in order */
function dateOffList(rep, q){
  if(!rep.dateOff) return [];
  var out=[];
  q.months.forEach(function(m){
    monthDates(m).forEach(function(iso){
      if(rep.dateOff[iso] && out.indexOf(iso)<0) out.push(iso);
    });
  });
  return out.sort();
}
function offDayCount(rep){
  var n=0; for(var d=0;d<7;d++) if(rep.daysOff && rep.daysOff[d]) n++; return n;
}

/* ---------- blocked times ----------
   A day off is one rep's own. A block is the company's: nobody in scope can be
   booked then, whatever they have marked. Recurring blocks carry `dow`, one-off
   blocks carry `date`; `slot` is one of AM/MID/PM or "*" for the whole day.
   `scope` is a branch code, or "ALL". */
/* ---------- companies ---------- */
function divisionList(){ return (state && state.divisions) || []; }
function divisionLabel(code){
  var d=divisionList().filter(function(x){ return x.code===code; })[0];
  return d ? d.label : code;
}
function divisionOf(code){
  for(var i=0;i<state.branches.length;i++) if(state.branches[i].code===code) return state.branches[i].division||"KQ";
  return "KQ";
}
function branchesIn(div){
  return state.branches.filter(function(b){ return (b.division||"KQ")===div; });
}
/* A branch may carry a fuller name; a code with no name just shows its code. */
function branchName(code){
  var b=(state.branches||[]).filter(function(x){ return x.code===code; })[0];
  return (b && b.name) || code;
}
function branchTitle(code){
  var n=branchName(code);
  return n!==code ? code+" · "+n : code;
}

function blockList(){ return (state && state.blocks) || []; }
function blockMatches(bl, code, iso, slot){
  /* scope is "ALL", a company code, or a branch code */
  if(bl.scope!=="ALL" && bl.scope!==code && bl.scope!==divisionOf(code)) return false;
  if(bl.slot!=="*" && bl.slot!==slot) return false;
  if(bl.date) return bl.date===iso;
  return bl.dow===parseDate(iso).getDay();
}
/* the block covering this slot for this branch, or null */
function blockAt(code, iso, slot){
  var all=blockList();
  for(var i=0;i<all.length;i++) if(blockMatches(all[i],code,iso,slot)) return all[i];
  return null;
}
function blockLabel(bl){ return (bl && String(bl.label||"").trim()) || "Blocked"; }
function blockWhen(bl){
  var when = bl.date ? DOW_FULL[parseDate(bl.date).getDay()]+" "+shortDate(parseDate(bl.date))
                     : "Every "+DOW_FULL[bl.dow];
  return when+" · "+(bl.slot==="*" ? "all slots" : bl.slot);
}
function blockScopeLabel(bl){
  if(bl.scope==="ALL") return "Everyone";
  if(divisionList().some(function(d){ return d.code===bl.scope; })) return divisionLabel(bl.scope)+" — all branches";
  return branchTitle(bl.scope);
}
/* the branch a rep sits on — blocks are scoped by branch, the math is per rep */
function branchCodeOf(rep){
  for(var i=0;i<state.branches.length;i++){
    var b=state.branches[i];
    for(var j=0;j<b.reps.length;j++) if(b.reps[j].id===rep.id) return b.code;
  }
  return state.branches[0].code;
}
/* blocks that touch a given quarter, soonest first — one-offs outside it drop out */
function blocksIn(code, q){
  var dates={};
  q.months.forEach(function(m){ monthDates(m).forEach(function(iso){ dates[iso]=1; }); });
  return blockList().filter(function(bl){
    if(bl.scope!=="ALL" && bl.scope!==code && bl.scope!==divisionOf(code)) return false;
    return bl.date ? !!dates[bl.date] : true;
  }).sort(function(a,z){
    if(!!a.date !== !!z.date) return a.date ? 1 : -1;      /* recurring first */
    if(a.date) return a.date < z.date ? -1 : 1;
    return a.dow - z.dow;
  });
}
function offDayNames(rep){
  return DAYOFF_ORDER.filter(function(d){ return rep.daysOff && rep.daysOff[d]; })
                     .map(function(d){ return DOW_FULL[d]; });
}
function uid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function buildQuarter(id){
  var y=+id.slice(0,4), qn=+id.slice(5), firstMonth=(qn-1)*3;
  var first=new Date(y,firstMonth,1);
  var start=addDays(first,-first.getDay());          /* Sunday on or before the 1st */
  var months=[];
  for(var i=0;i<3;i++){
    var m=new Date(y,firstMonth+i,1);
    months.push({
      key: m.getFullYear()+"-"+(m.getMonth()<9?"0":"")+(m.getMonth()+1),
      label: MONTH_FULL[m.getMonth()]+" "+m.getFullYear(),
      short: MONTH_FULL[m.getMonth()],
      start: fmtISO(addDays(start,i*35))
    });
  }
  return {id:id, label:"Q"+qn+" "+y, months:months};
}
function quarterSpan(q){
  var a=parseDate(q.months[0].start);
  return {from:a, to:addDays(a,104)};
}
function Q(){
  var qs=state.quarters;
  for(var i=0;i<qs.length;i++) if(qs[i].id===ui.quarter) return qs[i];
  return qs[0];
}
/* The quarter grids run a week or two past the month, so "the current month" is
   the one whose own key matches today — not whichever month the grid starts in. */
function defaultMonthKey(q){
  var now=new Date();
  var key=now.getFullYear()+"-"+(now.getMonth()<9?"0":"")+(now.getMonth()+1);
  var hit=q.months.filter(function(m){ return m.key===key; })[0];
  return hit ? hit.key : q.months[0].key;
}
function defaultQuarterId(){
  var now=new Date(); now.setHours(0,0,0,0);
  for(var i=0;i<QUARTER_IDS.length;i++){
    var sp=quarterSpan(buildQuarter(QUARTER_IDS[i]));
    if(now>=sp.from && now<=sp.to) return QUARTER_IDS[i];
  }
  return QUARTER_IDS[0];
}
/* other quarters whose grids also contain any day of this week */
function alsoIn(days){
  var a=parseDate(days[0]), b=parseDate(days[6]), out=[];
  state.quarters.forEach(function(q){
    if(q.id===ui.quarter) return;
    var sp=quarterSpan(q);
    if(a<=sp.to && b>=sp.from) out.push(q.label);
  });
  return out;
}

/* month -> array of 5 weeks, each an array of 7 ISO dates */
var weekCache = {};
function weeksOf(month){
  if(weekCache[month.key]) return weekCache[month.key];
  var start = parseDate(month.start), out=[];
  for(var w=0;w<5;w++){
    var days=[];
    for(var d=0;d<7;d++) days.push(fmtISO(addDays(start, w*7+d)));
    out.push(days);
  }
  weekCache[month.key]=out;
  return out;
}
function monthDates(month){
  var out=[]; weeksOf(month).forEach(function(w){ out=out.concat(w); }); return out;
}

/* ===================== state ===================== */
var state, ui, dirty=false, readOnly=false, canSave=true, saving=false, saveMode="files", artifactApi=null, pendingBackup=null;
/* Where this copy of the page stores its data. Detected at boot:
   "artifact" — running inside the claude.ai artifact viewer
   "netlify"  — served by the Netlify site, talking to /api/state
   "local"    — neither; this browser only                              */
var MODE="local", bootState=null;
var API=(document.querySelector('meta[name="capacity-api"]')||{}).content || "/api/capacity-state";
var conflictState=null, newerRev=0, pollTimer=null;
var CODE_KEY="ri-capacity-calendar/accesscode";
var accessCode=null, requiresCode=false, role=null;
var undoStack=[], UNDO_MAX=12, autosaveTimer=null;
var focusRepId=null, focusMiss=null, railOpen=false;

function normalize(s){
  /* v1 stored a single `quarter`; every version stores rep data keyed by date
     and month, so quarters can be rebuilt from the catalog without touching it. */
  s.quarters = QUARTER_IDS.map(buildQuarter);
  delete s.quarter;
  s.branches.forEach(function(b){
    b.reps.forEach(function(r){
      if(!r.slots) r.slots={};
      if(!r.timeOff) r.timeOff={};
      if(!r.status) r.status={};
      if(!r.daysOff) r.daysOff={};
      if(!r.dateOff) r.dateOff={};
    });
  });
  if(!s.targets) s.targets={weekTotal:12,weekPrime:5,monthTotal:50,monthPrime:25};
  if(!Array.isArray(s.divisions)) s.divisions=[];
  s.branches.forEach(function(b){ if(!b.division) b.division="KQ"; });
  if(!Array.isArray(s.blocks)) s.blocks=[];
  s.blocks.forEach(function(b){
    if(!b.id) b.id=uid();
    if(!b.scope) b.scope="ALL";
    if(!b.slot) b.slot="*";
  });
  return s;
}

function readSeed(){
  try{ return normalize(JSON.parse($("#cc-seed").textContent)); }
  catch(e){ console.error("seed parse failed",e); return null; }
}

function isNarrow(){ return window.matchMedia("(max-width:900px)").matches; }
function loadUI(){
  var wide=!isNarrow();
  var d={division:"KQ",branch:"SYR",repId:null,view:"calendar",quarter:null,month:null,cov:null,covSel:null,filter:"",
         panels:{key:wide, dayoff:wide}};
  try{
    var raw=sessionStorage.getItem(UI_KEY);
    if(raw){ var p=JSON.parse(raw); for(var k in p) if(p[k]!==undefined) d[k]=p[k]; }
    if(!d.panels) d.panels={key:wide, dayoff:wide};
  }catch(e){}
  return d;
}
function stashUI(){ try{ sessionStorage.setItem(UI_KEY, JSON.stringify(ui)); }catch(e){} }
function backup(){ try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(state)); }catch(e){} }

/* ===================== math ===================== */
/* A slot counts only if the rep marked it, is not off that day, and the company
   has not blocked that time for their branch. Marks under a block are kept, just
   not counted — lift the block and they come straight back. */
function isAvailable(rep, iso, slot, code){
  if(!rep.slots[slotKey(iso,slot)]) return false;
  if(isOffDay(rep,iso)) return false;
  return !blockAt(code||branchCodeOf(rep), iso, slot);
}
function countRange(rep, dates, code){
  code = code || branchCodeOf(rep);
  var t=0,p=0;
  for(var i=0;i<dates.length;i++){
    if(isOffDay(rep,dates[i])) continue;   /* scheduled day off — not available */
    for(var j=0;j<SLOTS.length;j++){
      if(blockAt(code,dates[i],SLOTS[j])) continue;
      if(rep.slots[slotKey(dates[i],SLOTS[j])]){ t++; if(isPrime(dates[i],SLOTS[j])) p++; }
    }
  }
  return {total:t, prime:p};
}
function monthCounts(rep, month, code){ return countRange(rep, monthDates(month), code); }
function monthByKey(key){
  var ms=Q().months;
  for(var i=0;i<ms.length;i++) if(ms[i].key===key) return ms[i];
  return ms[0];
}
function branchByCode(code){
  for(var i=0;i<state.branches.length;i++) if(state.branches[i].code===code) return state.branches[i];
  return state.branches[0];
}
function currentBranch(){ return branchByCode(ui.branch); }
function currentRep(){
  var b=currentBranch();
  for(var i=0;i<b.reps.length;i++) if(b.reps[i].id===ui.repId) return b.reps[i];
  return null;
}
/* compliance grade for a rep-month: none | short | met | appr */
function grade(rep, month){
  var c=monthCounts(rep,month), t=state.targets;
  if(c.total===0) return "none";
  if(rep.status && rep.status[month.key]==="approved") return "appr";
  if(c.total>=t.monthTotal && c.prime>=t.monthPrime) return "met";
  return "short";
}
var GRADE_LABEL={none:"Not started",short:"Short",met:"Meets target",appr:"Approved"};

/* ===================== save ===================== */
function setDirty(v){
  dirty=v;
  $("#saveBtn").disabled = !v || saving || readOnly || !canSave;
  paintSaveState();
  if(v){ backup(); scheduleAutosave(); }
}
/* Once we are allowed to write, saving stops being the user's job. */
function autosaveReady(){
  if(readOnly||!canSave||conflictState) return false;
  if(MODE==="netlify")  return !!role;
  if(MODE==="artifact") return saveMode==="files";
  return false;
}
function scheduleAutosave(){
  if(!autosaveReady()) return;
  clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(function(){
    if(dirty && !saving && !conflictState) save();
  },2500);
}
function paintSaveState(){
  var box=$("#saveState"), txt=$("#saveText"), cls="", msg="";
  if(readOnly){ cls="ro"; msg="View only — changes aren't saved"; }
  else if(!canSave){ cls="ro"; msg="Saving unavailable in this view"; }
  else if(MODE==="netlify" && !role && !dirty){ cls="ro"; msg="Locked — enter the access code"; }
  else if(saving){ cls="busy"; msg="Saving…"; }
  else if(dirty){ cls="dirty"; msg=autosaveReady()?"Saving in a moment…":"Unsaved changes"; }
  else msg = state.updatedAt ? "Saved "+relTime(state.updatedAt) : "All changes saved";
  box.className="savestate"+(cls?" "+cls:"");
  txt.textContent=msg;
  /* a phone shows the dot alone for everything but a warning, so the words still
     have to reach a screen reader and a long-press */
  box.title=msg;
  box.setAttribute("aria-label",msg);
}
function relTime(iso){
  var d=new Date(iso), diff=(Date.now()-d.getTime())/1000;
  if(diff<60) return "just now";
  if(diff<3600) return Math.round(diff/60)+" min ago";
  if(diff<86400) return Math.round(diff/3600)+" hr ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function toast(msg,bad,actionLabel,actionFn){
  var t=$("#toast");
  t.textContent="";
  t.appendChild(el("span",null,msg));
  if(actionLabel && actionFn){
    var a=el("button",null,actionLabel);
    a.onclick=function(){ t.className="toast"+(bad?" bad":""); actionFn(); };
    t.appendChild(a);
  }
  t.className="toast show"+(bad?" bad":"");
  clearTimeout(t._t);
  t._t=setTimeout(function(){ t.className="toast"+(bad?" bad":""); }, actionLabel?6500:3200);
}

function injectSeed(src, json){
  var re=/(<script[^>]*id="cc-seed"[^>]*>)([\s\S]*?)(<\/script>)/;
  if(!re.test(src)) throw {code:"invalid_content",message:"Could not find the data block in the page source."};
  return src.replace(re, function(_,a,b,c){ return a+"\n"+json+"\n"+c; });
}

/* ---------- undo ----------
   Every destructive action snapshots the whole state first. Cheap at this
   size, and it means nothing a user clicks is unrecoverable. */
function pushUndo(label){
  try{ undoStack.push({label:label, json:JSON.stringify(state)}); }catch(e){ return; }
  if(undoStack.length>UNDO_MAX) undoStack.shift();
}
function canUndo(){ return undoStack.length>0 && !readOnly; }
function undo(){
  if(!canUndo()) return;
  var step=undoStack.pop();
  var rev=state.rev;
  try{ state=normalize(JSON.parse(step.json)); }catch(e){ toast("Couldn't undo that.",true); return; }
  state.rev=rev;                 /* keep our place in the save sequence */
  weekCache={};
  setDirty(true); render();
  toast("Undid: "+step.label);
}

/* ---------- the access code (Netlify mode) ----------
   One code, entered once. Which one it is decides the role, and the role is the
   server's answer, not this page's guess — everything below only changes what
   is worth putting on screen. */
function loadAccessCode(){
  try{ return sessionStorage.getItem(CODE_KEY) || localStorage.getItem(CODE_KEY) || null; }catch(e){ return null; }
}
function rememberAccessCode(v, forever){
  accessCode=v;
  try{
    sessionStorage.setItem(CODE_KEY,v);
    if(forever) localStorage.setItem(CODE_KEY,v); else localStorage.removeItem(CODE_KEY);
  }catch(e){}
}
function forgetAccessCode(){
  accessCode=null; role=null;
  try{ sessionStorage.removeItem(CODE_KEY); localStorage.removeItem(CODE_KEY); }catch(e){}
}
/* Admin does everything; a manager may change what people entered, but not the
   shape of the calendar. The server enforces this either way. */
function isAdmin(){ return MODE!=="netlify" || role==="admin"; }
function roleLabel(){ return role==="manager" ? "Sales manager" : role==="admin" ? "Admin" : ""; }
/* one place to say no, so every refusal reads the same */
function adminOnly(what){
  toast(what+" needs the admin code.", true);
}

function viewHeaders(){ return accessCode ? {"x-access-code":accessCode} : {}; }

/* ---------- storage backends ---------- */
var Backend={

  /* Published as a claude.ai artifact: the page republishes itself. */
  artifact:{
    shared:true,
    async load(){
      try{
        var r=await fetch("data/state.json",{cache:"no-store"});
        if(r.ok){ var j=await r.json(); if(j && j.branches) return j; }
      }catch(e){}
      return null;
    },
    async save(next){
      var json=JSON.stringify(next).replace(/</g,"\\u003c");
      if(saveMode==="files"){
        try{
          await artifactApi.publish({"data/state.json":{content:json,contentType:"application/json"}});
          return;
        }catch(e){
          var code=e&&e.code;
          if(code==="capability_disabled"||code==="read_only_path"||code==="transform_error"||code==="invalid_content") saveMode="html";
          else throw e;
        }
      }
      var src=await fetch(location.href,{cache:"no-store"}).then(function(r){ return r.text(); });
      if(!/^\s*<!doctype/i.test(src)) throw {code:"invalid_content",message:"The page source could not be read for saving."};
      await artifactApi.publish(injectSeed(src,json));
    }
  },

  /* Served by the Netlify site: one shared JSON blob behind /api/state. */
  netlify:{
    shared:true,
    async load(){
      if(bootState!==null){ var first=bootState; bootState=null; return first||null; }
      var r=await fetch(API,{cache:"no-store",headers:viewHeaders()});
      if(r.status===401) throw {code:"access_code"};
      if(!r.ok) throw {code:"upstream_error",message:"The server returned "+r.status+"."};
      var j=await r.json();
      if(j.role) role=j.role;
      return j.state||null;
    },
    async save(next, force){
      var r=await fetch(API,{
        method:"PUT",
        headers:{"content-type":"application/json","x-access-code":accessCode||""},
        body:JSON.stringify({state:next, force:!!force})
      });
      if(r.status===401) throw {code:"access_code"};
      if(r.status===403){
        var jf=await r.json();
        throw {code:"admin_only", message:jf.message, changed:jf.changed};
      }
      if(r.status===409){
        var j=await r.json();
        throw {code:"conflict", live:j.state};
      }
      if(r.status===413) throw {code:"too_large"};
      if(!r.ok) throw {code:"upstream_error",message:"The server returned "+r.status+"."};
      var okj=await r.json();
      if(okj && okj.rev) next.rev=okj.rev;
    }
  },

  /* Opened straight from disk, or the site's API is unreachable. */
  local:{
    shared:false,
    async load(){ return null; },
    async save(){ backup(); }
  }
};

async function save(force){
  force = force===true;
  if(saving||readOnly||!canSave) return;

  saving=true; $("#saveBtn").disabled=true; paintSaveState();
  var prevRev=state.rev||0;
  state.rev=prevRev+1;
  state.updatedAt=new Date().toISOString();
  stashUI(); backup();

  try{
    await Backend[MODE].save(state, force);
  }catch(e){
    saving=false;
    state.rev=prevRev;
    handleSaveError(e);
    return;
  }
  saving=false;
  conflictState=null; newerRev=0;
  setDirty(false); paintSaveState();
  toast(Backend[MODE].shared ? "Saved. Everyone with the link sees this version." : "Saved in this browser.");
  if(MODE==="netlify") render();
}

function handleSaveError(e){
  var code=e&&e.code, msg=e&&e.message;

  /* The role boundary, refused by the server. The page hides these controls
     from a manager already, so getting here means something got out of step —
     say plainly what was refused rather than "couldn't save". */
  if(code==="admin_only"){
    setDirty(true);
    toast(msg || "That change needs the admin code.", true);
    return;
  }
  if(code==="access_code"){
    setDirty(true);
    toast("That code is no longer accepted — sign in again.", true);
    forgetAccessCode();
    setTimeout(function(){ showGate("Enter the code again to carry on."); }, 900);
    return;
  }
  if(code==="conflict"){
    if(e.live){                                  /* Netlify: we hold their version */
      conflictState=normalize(e.live);
      setDirty(true); render();
      return;
    }
    toast("Someone else saved first — reloading to their version.",true);
    return;                                      /* artifact: the shell reloads this view */
  }
  if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="consent_required"){
    readOnly=true; setDirty(false); paintSaveState(); render();
    toast("You have view-only access to this calendar.",true);
    return;
  }
  if(code==="rate_limited") toast("Saving too quickly — wait a moment and try again.",true);
  else if(code==="too_large") toast("This calendar is too large to save. Remove some reps or export a backup.",true);
  else toast("Couldn't save: "+(msg||"unknown error")+". Your work is still here — try again.",true);
  setDirty(true);
}

/* ---------- watch for saves made elsewhere (Netlify only) ---------- */
function startPolling(){
  if(MODE!=="netlify" || pollTimer) return;
  pollTimer=setInterval(async function(){
    if(saving||dirty||conflictState||document.hidden) return;
    try{
      var r=await fetch(API+"?meta=1",{cache:"no-store",headers:viewHeaders()});
      if(!r.ok) return;
      var j=await r.json();
      if((j.rev||0) > (state.rev||0) && j.rev!==newerRev){ newerRev=j.rev; render(); }
    }catch(e){}
  },45000);
}
async function loadLatest(){
  try{
    var remote=await Backend[MODE].load();
    if(remote){
      state=adopt(normalize(remote),true);
      weekCache={}; conflictState=null; newerRev=0;
      setDirty(false); render();
      toast("Loaded the latest saved version.");
    }
  }catch(e){ toast("Couldn't reach the server. Try again in a moment.",true); }
}

/* ===================== render: shell ===================== */
var VIEWS=[
  {id:"calendar", label:"Rep Calendar"},
  {id:"coverage", label:"Branch Coverage"},
  {id:"compliance", label:"Compliance"},

function syncQuarterUI(){
  var ids=state.quarters.map(function(q){ return q.id; });
  if(ids.indexOf(ui.quarter)<0) ui.quarter=defaultQuarterId();
  var keys=Q().months.map(function(m){ return m.key; });
  if(keys.indexOf(ui.month)<0) ui.month=defaultMonthKey(Q());
  if(keys.indexOf(ui.cov)<0) ui.cov=defaultMonthKey(Q());
  /* a restore, import or removal can leave these pointing at things that are gone */
  if(!divisionList().some(function(d){ return d.code===ui.division; })) ui.division=divisionList()[0].code;
  if(!state.branches.some(function(b){ return b.code===ui.branch; })) ui.branch=state.branches[0].code;
  /* the branch always belongs to the company on screen, whichever moved last */
  ui.division = divisionOf(ui.branch);
  var reps=currentBranch().reps;
  if(!reps.some(function(r){ return r.id===ui.repId; })) ui.repId = reps.length ? reps[0].id : null;
}
function renderQuarterPicker(){
  var sel=$("#qSel");
  sel.textContent="";
  state.quarters.forEach(function(q){
    var op=el("option",null,q.label);
    op.value=q.id;
    if(q.id===ui.quarter) op.selected=true;
    sel.appendChild(op);
  });
  var i=state.quarters.map(function(q){ return q.id; }).indexOf(ui.quarter);
  $("#qPrev").disabled = i<=0;
  $("#qNext").disabled = i>=state.quarters.length-1;
}
function setQuarter(id){
  ui.quarter=id; ui.covSel=null;
  var k=defaultMonthKey(Q());
  ui.month=k; ui.cov=k;
  stashUI(); render();
}
function stepQuarter(delta){
  var ids=state.quarters.map(function(q){ return q.id; });
  var i=ids.indexOf(ui.quarter)+delta;
  if(i>=0 && i<ids.length) setQuarter(ids[i]);
}

   below it — and everything downstream — narrows to that company's branches. */
function renderDivSeg(){
  var divs=divisionList();
  ["#divSeg","#divSegMobile"].forEach(function(sel){
    var seg=$(sel); if(!seg) return;
    seg.textContent="";
    seg.hidden = divs.length<2;
    divs.forEach(function(d){
      var n=branchesIn(d.code).reduce(function(a,b){ return a+b.reps.length; },0);
      var btn=el("button");
      btn.setAttribute("aria-pressed", d.code===ui.division ? "true":"false");
      btn.appendChild(el("span",null,d.label));
      btn.appendChild(el("span","cnt mono",String(n)));
      btn.title=d.label+" — "+branchesIn(d.code).length+" branches, "+n+" reps";
      btn.onclick=function(){
        if(ui.division===d.code) return;
        ui.division=d.code;
        var first=branchesIn(d.code)[0];
        ui.branch = first ? first.code : ui.branch;
        ui.repId = first && first.reps.length ? first.reps[0].id : null;
        ui.covSel=null; stashUI(); render();

      seg.appendChild(btn);

/* ===================== popovers ===================== */
var openPop=null;
function closePop(){ if(openPop){ openPop.remove(); openPop=null; document.removeEventListener("mousedown",onDocDown,true); } }
function onDocDown(e){ if(openPop && !openPop.contains(e.target)) closePop(); }
function popAt(anchor, node){
  closePop();
  node.className="pop";
  document.body.appendChild(node);
  var r=anchor.getBoundingClientRect();
  var top=r.bottom+6, left=Math.min(r.left, window.innerWidth-node.offsetWidth-12);
  if(top+node.offsetHeight>window.innerHeight-8) top=Math.max(8, r.top-node.offsetHeight-6);
  node.style.top=top+"px"; node.style.left=Math.max(8,left)+"px";
  openPop=node;
  setTimeout(function(){ document.addEventListener("mousedown",onDocDown,true); },0);
  return node;
}

function openRepMenu(anchor, rep){
  if(readOnly){ toast("View-only access — the roster can't be changed.",true); return; }
  var p=el("div");
  var link=el("button",null,"Copy this rep's link");
  link.onclick=function(){ showRepLink(anchor,rep); };
  p.appendChild(link);

  if(isAdmin()){
    var rename=el("button",null,"Rename…");
    rename.onclick=function(){ openRename(anchor,rep); };
    p.appendChild(rename);
  }

  (isAdmin() ? state.branches.filter(function(b){ return b.code!==ui.branch; }) : []).forEach(function(b){
    /* a move across companies is a real thing to do, but it should never happen
       by accident — so it says which company it is landing in */
    var far=(b.division||"KQ")!==ui.division;
    var mv=el("button",null,"Move to "+(far ? divisionLabel(b.division||"KQ")+" · " : "")+branchTitle(b.code));
    mv.onclick=function(){
      pushUndo("Move "+rep.name+" to "+b.code);
      var src=currentBranch();
      src.reps=src.reps.filter(function(x){ return x.id!==rep.id; });
      b.reps.push(rep);
      if(ui.repId===rep.id) ui.repId = src.reps.length ? src.reps[0].id : null;
      closePop(); setDirty(true); render();
      toast(rep.name+" moved to "+(far ? divisionLabel(b.division||"KQ")+" · " : "")+branchTitle(b.code)+".", false, "Undo", undo);
    };
    p.appendChild(mv);
  });

  p.appendChild(el("div","sep"));
  var clr=el("button",null,"Clear "+Q().label+" selections");
  clr.onclick=function(){
    pushUndo("Clear "+Q().label+" for "+rep.name);
    var n=0;
    Q().months.forEach(function(m){
      monthDates(m).forEach(function(iso){
        SLOTS.forEach(function(sl){
          var k=slotKey(iso,sl);
          if(rep.slots[k]){ delete rep.slots[k]; n++; }
        });
      });
    });
    closePop(); setDirty(true); render();
    toast("Cleared "+n+" slot"+(n===1?"":"s")+" in "+Q().label+" for "+rep.name+".", false, "Undo", undo);
  };
  p.appendChild(clr);

  if(isAdmin()){
    var del=el("button","danger","Remove from "+ui.branch);
    del.onclick=function(){ confirmRemove(anchor,rep); };
    p.appendChild(del);
  }else{
    p.appendChild(el("div","ttl","Renaming, moving and removing need the admin code."));
  }
  popAt(anchor,p);
}

/* ===================== import / export ===================== */
async function offerDownload(name, text){
  var dl=null;
  try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl){ toast("Downloads aren't available in this view.",true); return; }
  try{
    await dl.save({filename:name, data:text});
    toast("Saved "+name+".");
  }catch(e){
    var c=e&&e.code;
    if(c==="declined") return;
    if(c==="extension_not_enabled") toast("This view can't save that file type. Try the .json backup instead.",true);
    else if(c==="too_large") toast("That file is too large to download here.",true);
    else if(c==="rate_limited") toast("A download prompt is already open — finish that one first.",true);
    else toast("Couldn't start the download: "+((e&&e.message)||"unknown error"),true);
  }
}
function exportJSON(){
  offerDownload("ri-capacity-"+Q().id+".json", JSON.stringify(state,null,2));
}
function exportCSV(){
  var b=currentBranch(), rows=[["Branch","Rep","Month","Week","Date","Day","Slot","Prime"]];
  b.reps.forEach(function(r){
    Q().months.forEach(function(m){
      weeksOf(m).forEach(function(days,wi){
        days.forEach(function(iso){
          if(isOffDay(r,iso)) return;
          SLOTS.forEach(function(s){
            if(blockAt(b.code,iso,s)) return;
            if(r.slots[slotKey(iso,s)]){
              rows.push([b.code,r.name,m.label,"Week "+(wi+1),iso,DOW[parseDate(iso).getDay()],s,isPrime(iso,s)?"Prime":""]);
            }
          });
        });
      });
    });
  });
  var csv=rows.map(function(r){ return r.map(function(c){ return /[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c; }).join(","); }).join("\n");
  offerDownload("ri-capacity-"+b.code+"-"+Q().id+".csv", csv);
}
function importJSON(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var s=normalize(JSON.parse(fr.result));
        if(!s.branches||!(s.quarter||s.quarters)) throw new Error("bad shape");
        pushUndo("Import backup");
        state=adopt(s,true); ui.repId=null; ui.covSel=null; weekCache={};
        setDirty(true); render(); toast("Backup loaded. Press Save to share it.");
      }catch(e){ toast("That file isn't a capacity calendar backup.",true); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

    cb.appendChild(el("span","spacer"));

    theirs.onclick=function(){
      state=adopt(conflictState,true); conflictState=null; weekCache={};

      toast("Loaded their version. Your edits are still backed up in this browser — restore them from the ⋯ menu if you need them.");
    };

    var drop=el("button","btn sm","Discard");

    rb.appendChild(use); rb.appendChild(drop);

  if(ui.view==="calendar") viewCalendar(v);

function meter(value, target, tone){
  var wrap=el("div","meter");
  var pct=Math.max(0,Math.min(100, target? (value/target)*100 : 0));
  var bar=el("i", tone || (value===0?"":value>=target?"ok":"warn"));
  bar.style.width=pct+"%";
  wrap.appendChild(bar);
  return wrap;
}

/* ---------- calendar ---------- */
function viewCalendar(root){
  var rep=currentRep(), b=currentBranch();
  if(!rep){
    var e=el("div","empty");
    e.appendChild(el("h3",null, b.reps.length ? "Pick a rep" : "No reps in "+b.code+" yet"));
    e.appendChild(el("p",null, b.reps.length
      ? "Choose someone from the roster on the left to open their "+Q().label+" availability."
      : "Add a rep in the left panel and their July, August and September calendars appear here, ready to fill in."));
    root.appendChild(e);
    return;
  }
  var month=monthByKey(ui.month);

  var head=el("div","pagehead");
  var l=el("div");
  l.appendChild(el("div","eyebrow", divisionLabel(ui.division)+" · "+branchTitle(b.code)+" · "+Q().label));
  l.appendChild(el("h2",null,rep.name));
  l.appendChild(el("div","sub", focusRepId
    ? "Tap the slots you can take an appointment in — drag across a row to fill several. Your changes save themselves."
    : "Tap the slots this rep can take an appointment in — drag across a row to fill several."));
  head.appendChild(l);
  var months=el("div","months");
  Q().months.forEach(function(m){
    var btn=el("button",null,m.short);
    var g=grade(rep,m);
    var dot=el("i","mdot"+(g==="met"||g==="appr"?" ok":g==="short"?" warn":""));
    btn.appendChild(dot);
    btn.title=m.label+" — "+GRADE_LABEL[g];

    btn.onclick=function(){ ui.month=m.key; stashUI(); render(); };
    months.appendChild(btn);
  });
  head.appendChild(months);
  root.appendChild(head);

  /* The key used to sit under five week bands, where nobody found it. */
  var key=panel("key","Colour key","teal = available, amber = prime time");
  key.body.appendChild(legendItem("std","Available"));
  key.body.appendChild(legendItem("prime","Available · prime time"));
  key.body.appendChild(legendItem("primeempty","Prime slot, still open"));
  key.body.appendChild(legendItem("off","Day off, every week"));
  key.body.appendChild(legendItem("once","One day off — click any date to set it"));

  key.body.appendChild(el("span","lg","Prime time is any weekend slot, or a weekday PM. You need "+state.targets.weekPrime+" a week."));

  root.appendChild(dayOffStrip(rep));

  /* month summary */
  var c=monthCounts(rep,month), T=state.targets;

      toast("Week "+(wi+1)+" cleared.", false, "Undo", undo);

  days.forEach(function(iso){

    var pretty=DOW_FULL[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate();
    if(recur){
      cell.title=DOW_FULL[d.getDay()]+"s are blocked for "+rep.name+" in Scheduled days off.";
      cell.disabled=true;
    }else if(readOnly){
      cell.disabled=true;
    }else{
      cell.title = once ? "Day off — click to put "+pretty+" back" : "Click to mark "+pretty+" as a day off";
      cell.setAttribute("aria-pressed", once?"true":"false");
      cell.onclick=function(){
        pushUndo((once?"Restore ":"Block ")+pretty);
        if(!rep.dateOff) rep.dateOff={};
        if(once) delete rep.dateOff[iso]; else rep.dateOff[iso]=1;
        setDirty(true); render();
        if(!once) toast(pretty+" marked as a day off.", false, "Undo", undo);
      };
    }
    hdr.appendChild(cell);
  });
  inner.appendChild(hdr);

  SLOTS.forEach(function(slot){
    var row=el("div","grow7"+(slot==="PM"?" row-pm":""));
    row.appendChild(el("div","slotlbl",slot));
    days.forEach(function(iso){
      var wrap=el("div","cellwrap");
      if(isOffDay(rep,iso)){
        var recurring=isRecurringOff(rep,iso);
        wrap.classList.add("off");
        if(!recurring) wrap.classList.add("once");
        if(slot==="MID") wrap.appendChild(el("div","offlabel", recurring ? "Scheduled day off" : "Day off"));
        wrap.appendChild(deadZone(rep, iso, slot, null));
        row.appendChild(wrap);
        return;
      }
      var bl=blockAt(bcode, iso, slot);
      if(bl){
        wrap.classList.add("blk");
        wrap.appendChild(el("div","blklabel", blockLabel(bl)));
        wrap.appendChild(deadZone(rep, iso, slot, bl));
        row.appendChild(wrap);
        return;
      }
      var prime=isPrime(iso,slot);
      var on=!!rep.slots[slotKey(iso,slot)];
      var btn=el("button","cell"+(prime?" prime":"")+(on?" on":""));
      btn.appendChild(el("span","mk","✓"));
      var d=parseDate(iso);
      btn.dataset.iso=iso; btn.dataset.slot=slot;
      btn.dataset.idx = String(wi*21 + SLOTS.indexOf(slot)*7 + days.indexOf(iso));
      btn.setAttribute("aria-pressed", on?"true":"false");
      btn.setAttribute("aria-label", DOW[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate()+" "+slot+(prime?" (prime time)":"")+(on?" — available":" — not available"));
      if(readOnly){ btn.disabled=true; }

        btn.onkeydown=function(ev){ cellKey(ev, rep, month, iso, slot, +btn.dataset.idx); };
      }
      wrap.appendChild(btn);
      row.appendChild(wrap);
    });
    inner.appendChild(row);
  });

  wirePaint(inner, rep, month);
  scroll.appendChild(inner);
  band.appendChild(scroll);

  return band;
}
/* A cell that ignores clicks reads as a broken checkbox — the commonest "it
   won't tick" report. Cover every blocked cell with something that answers
   "why not?" and, where the user can lift it, offers to. */
function deadZone(rep, iso, slot, bl){
  var d=parseDate(iso), pretty=DOW_FULL[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate();
  var hit=el("button","deadzone");
  hit.setAttribute("aria-label","Unavailable — "+pretty+" "+slot+". Why?");
  if(bl){
    hit.title=blockLabel(bl)+" — "+blockWhen(bl)+" ("+blockScopeLabel(bl)+"). Nobody can be booked then.";
  }else if(isRecurringOff(rep,iso)){
    hit.title=DOW_FULL[d.getDay()]+"s are a scheduled day off for "+rep.name+".";
  }else{
    hit.title=pretty+" is marked as a day off for "+rep.name+".";
  }
  hit.onclick=function(ev){
    ev.preventDefault(); ev.stopPropagation();
    explainBlocked(ev.currentTarget, rep, iso, slot, bl);
  };
  return hit;
}
function explainBlocked(anchor, rep, iso, slot, bl){
  var d=parseDate(iso), pretty=DOW_FULL[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate();
  var p=el("div");

  if(bl){
    p.appendChild(el("div","ttl","“"+blockLabel(bl)+"” blocks this time for "+blockScopeLabel(bl)+"."));
    p.appendChild(el("div","ttl",blockWhen(bl)+". Nobody can be booked then, so the box can't be ticked."));
    if(!readOnly){
      var go=el("button",null,"Manage blocked times…");
      go.onclick=function(){ closePop(); ui.view="blocks"; stashUI(); render(); };
      p.appendChild(go);
    }
    popAt(anchor,p);
    return;
  }

  var recurring=isRecurringOff(rep,iso);
  p.appendChild(el("div","ttl", recurring
    ? DOW_FULL[d.getDay()]+"s are a scheduled day off for "+rep.name+", so this box can't be ticked."
    : pretty+" is marked as a day off for "+rep.name+", so this box can't be ticked."));
  if(readOnly){ popAt(anchor,p); return; }

  if(recurring){
    var un=el("button",null,"Make "+DOW_FULL[d.getDay()]+"s available again");
    un.onclick=function(){
      pushUndo("Unblock "+DOW_FULL[d.getDay()]+"s");
      delete rep.daysOff[d.getDay()];
      closePop(); setDirty(true); render();
      toast(DOW_FULL[d.getDay()]+"s are available again for "+rep.name+".", false, "Undo", undo);
    };
    p.appendChild(un);
  }else{
    var back=el("button",null,"Put "+shortDate(d)+" back");
    back.onclick=function(){
      pushUndo("Restore "+shortDate(d));
      delete rep.dateOff[iso];
      closePop(); setDirty(true); render();
      toast(pretty+" is available again for "+rep.name+".", false, "Undo", undo);
    };
    p.appendChild(back);
  }
  popAt(anchor,p);
}

/* Pointer events cover mouse, pen and touch alike; the old mousedown/mouseenter
   pair meant a phone or tablet could tap but never drag across a run of slots. */
function wirePaint(container, rep, month){
  if(readOnly) return;
  container.addEventListener("pointerdown", function(ev){
    var c=ev.target.closest && ev.target.closest(".cell");
    if(!c || c.disabled) return;
    ev.preventDefault();
    var cur=!!rep.slots[slotKey(c.dataset.iso,c.dataset.slot)];
    painting={value:!cur};
    pushUndo(cur?"Remove slots":"Add slots");
    applyCell(rep,c.dataset.iso,c.dataset.slot,painting.value);
    refreshBand(rep,month);
    try{ container.setPointerCapture(ev.pointerId); }catch(e){}
  });
  container.addEventListener("pointermove", function(ev){
    if(!painting) return;
    var t=document.elementFromPoint(ev.clientX,ev.clientY);
    var c=t && t.closest && t.closest(".cell");
    if(!c || !c.dataset.iso || c.disabled) return;
    if(!!rep.slots[slotKey(c.dataset.iso,c.dataset.slot)]===painting.value) return;
    applyCell(rep,c.dataset.iso,c.dataset.slot,painting.value);
    refreshBand(rep,month);
  });
}

function cellKey(ev, rep, month, iso, slot, idx){
  if(ev.key===" "||ev.key==="Enter"){
    ev.preventDefault();
    pushUndo("Change a slot");
    applyCell(rep,iso,slot,!rep.slots[slotKey(iso,slot)]);
    refreshBand(rep,month);
    return;
  }
  var step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[ev.key];
  if(!step) return;
  ev.preventDefault();
  /* step past any blocked day rather than dead-ending on it */
  for(var i=1;i<=21;i++){
    var t=document.querySelector('#view .cell[data-idx="'+(idx+step*i)+'"]');
    if(t){ t.focus(); return; }
  }
}

function applyCell(rep, iso, slot, on){
  var k=slotKey(iso,slot);
  if(on) rep.slots[k]=1; else delete rep.slots[k];
  if(!dirty) setDirty(true); else backup();
}
/* light refresh: repaint cells + meters without a full re-render (keeps drag smooth) */
var refreshQueued=false;
function refreshBand(rep,month){
  if(refreshQueued) return;
  refreshQueued=true;
  requestAnimationFrame(function(){
    refreshQueued=false;
    var v=$("#view"), code=branchCodeOf(rep);
    var bands=v.querySelectorAll(".week");
    var weeks=weeksOf(month), T=state.targets;
    bands.forEach(function(band,wi){
      var days=weeks[wi]; if(!days) return;
      /* Read each cell's own date and slot. Walking by column index breaks the
         moment a day off or a block removes a cell from the row: every cell
         after the gap picks up its neighbour's value, and the one the user just
         clicked appears not to respond at all. */
      band.querySelectorAll(".gridin .cell").forEach(function(cell){
        var on=!!rep.slots[slotKey(cell.dataset.iso, cell.dataset.slot)];
        cell.classList.toggle("on",on);
        cell.setAttribute("aria-pressed",on?"true":"false");
      });
      var c=countRange(rep,days,code);
      var wms=band.querySelectorAll(".wm");
      setWM(wms[0],c.total,T.weekTotal);
      setWM(wms[1],c.prime,T.weekPrime);
    });
    var mc=monthCounts(rep,month,code);
    var blocks=v.querySelectorAll(".msum .grow");
    setStat(blocks[0],mc.total,T.monthTotal);
    setStat(blocks[1],mc.prime,T.monthPrime);
  });
}
function setWM(node,value,target){

  var bar=node.querySelector(".meter i");

  var weeks=weeksOf(month);
  var counts={}, max=0, totalSlots=0, primeSlots=0, thin=[];
  weeks.forEach(function(days){

      SLOTS.forEach(function(s){
        var n=0;
        b.reps.forEach(function(r){ if(isAvailable(r,iso,s,b.code)) n++; });
        counts[slotKey(iso,s)]=n;
        if(n>max) max=n;
        totalSlots+=n;
        if(isPrime(iso,s)) primeSlots+=n;
        if(isPrime(iso,s) && n===0) thin.push(iso+"|"+s);
      });
    });
  });

  var sum=el("div","msum");
  var primeCount=0;
  weeks.forEach(function(days){ days.forEach(function(iso){ SLOTS.forEach(function(s){ if(isPrime(iso,s)) primeCount++; }); }); });
  sum.appendChild(kpi("Rep-slots covered", totalSlots, "in "+month.short));
  sum.appendChild(kpi("Prime rep-slots", primeSlots, "in "+month.short));
  sum.appendChild(kpi("Peak in one slot", max, max===1?"rep at once":"reps at once"));
  sum.appendChild(kpi("Uncovered prime slots", thin.length, "of "+primeCount));
  root.appendChild(sum);

  var hm=el("div","hm"), scroll=el("div","hmscroll"), inner=el("div","hmin");
  weeks.forEach(function(days,wi){
    var wk=el("div","hmweek");
    var lab=el("div","wlab","Week "+(wi+1)+" · "+shortDate(parseDate(days[0]))+" – "+shortDate(parseDate(days[6])));
    wk.appendChild(lab);

    SLOTS.forEach(function(s){
      wk.appendChild(el("div","rl",s));
      days.forEach(function(iso){
        var n=counts[slotKey(iso,s)], prime=isPrime(iso,s);
        var c=el("button","hmcell"+(n===0?" z":""), n===0?"·":String(n));
        if(n>0){
          var t=max?n/max:0;
          var base=prime?"var(--prime)":"var(--std)";
          c.style.background="color-mix(in srgb, "+base+" "+Math.round(18+t*82)+"%, var(--surface))";
          c.style.borderColor=prime?"var(--prime-edge)":"var(--std-edge)";

/* What one block actually costs a rep over the quarter — better to state it than
   leave people wondering why their totals slipped. */
function costOf(bl){
  var n=0, prime=0, code=(bl.scope==="ALL") ? "ALL" : bl.scope;
  Q().months.forEach(function(m){
    monthDates(m).forEach(function(iso){
      SLOTS.forEach(function(sl){
        if(!blockMatches(bl, code, iso, sl)) return;
        n++; if(isPrime(iso,sl)) prime++;
      });
    });
  });
  return n+" slot"+(n===1?"":"s")+(prime?" ("+prime+" prime)":"");
}

/* ===================== boot ===================== */
function pickState(seed, fetched, backupState){
  var best=seed;
  if(fetched && (fetched.rev||0) >= (best.rev||0)) best=fetched;
  if(backupState && (backupState.rev||0) > (best.rev||0)) best=backupState;
  return best;
}

async function detectBackend(){
  /* Inside the claude.ai artifact viewer the page republishes itself. */
  if(window.claude && window.claude.use){
    try{ artifactApi = await window.claude.use("artifact"); }catch(e){ artifactApi=null; }
    if(artifactApi){ MODE="artifact"; return; }
  }
  /* Served by the Netlify site. ?info=1 is the one thing answerable without a
     code — it says which codes are needed and nothing else, so the page knows
     whether to open its gate before asking for any data. */
  try{
    var r=await fetch(API+"?info=1",{cache:"no-store"});
    if(r.ok){
      var j=await r.json();
      if(j && j.ok){
        MODE="netlify";
        requiresCode=!!j.requiresCode;
        accessCode=loadAccessCode();
        return;
      }
    }
  }catch(e){}
  MODE="local";
}

/* ---------- the gate ----------
   The page ships with no roster and no availability in it; both arrive from the
   function, which will not answer without the code. So this is the real barrier,
   not a screen drawn over data that is already here. */
function showGate(msg){
  $("#app").hidden=true;
  $("#gate").hidden=false;
  var err=$("#gateErr");
  if(msg){ err.textContent=msg; err.hidden=false; } else { err.hidden=true; }
  var box=$("#gateCode");
  box.disabled=false; $("#gateGo").disabled=false;
  box.focus(); box.select();
}
function hideGate(){ $("#gate").hidden=true; $("#app").hidden=false; }

/* Ask the server whether this code is any good — the only way to find out. */
/* Returns the state on success and null when the code is wrong. The reply also
   carries the role — admin or manager — which is what the page keys off. */
async function tryAccessCode(code){
  var r=await fetch(API,{cache:"no-store",headers:{"x-access-code":code}});
  if(r.status===401) return null;
  if(!r.ok) throw new Error("The server returned "+r.status+".");
  var j=await r.json();
  role = j.role || null;
  return j.state || null;
}

$("#gateForm").onsubmit=async function(ev){
  ev.preventDefault();
  var box=$("#gateCode"), code=box.value.trim();
  if(!code) return;
  box.disabled=true; $("#gateGo").disabled=true; $("#gateErr").hidden=true;
  var got=null;
  try{
    got=await tryAccessCode(code);
  }catch(e){
    showGate("Couldn't reach the calendar — "+(e.message||"try again in a moment."));
    return;
  }
  if(!got && got!==false){
    showGate("That code wasn't recognised. Check it with whoever sent you the link.");
    box.value="";
    return;
  }
  rememberAccessCode(code, $("#gateRemember").checked);
  hideGate();
  startApp(got);
};

async function boot(){
  var seed=readSeed();
  if(!seed){ document.body.innerHTML='<div style="padding:40px;font-family:sans-serif">This calendar\u2019s data could not be read.</div>'; return; }
  ui=loadUI();

  await detectBackend();

  if(MODE==="netlify" && requiresCode){
    /* a code remembered from last time saves the reader typing it again */
    if(accessCode){
      try{
        var known=await tryAccessCode(accessCode);
        if(known){ hideGate(); startApp(known); return; }
      }catch(e){}
      forgetAccessCode();
    }
    showGate(null);
    return;
  }

  var remote=null;
  try{
    var raw=await Backend[MODE].load();
    if(raw && raw.branches && (raw.quarter||raw.quarters)) remote=normalize(raw);
  }catch(e){}

  hideGate();
  startApp(remote);
}

function startApp(remote){
  var seed=readSeed();
  state = pickState(seed, remote ? normalize(remote) : null, null);

  /* A newer local copy means a save failed, or this browser was offline. */
  var bk=null;
  try{
    var s2=localStorage.getItem(BACKUP_KEY);
    if(s2){ var pj=JSON.parse(s2); if(pj&&pj.branches&&(pj.quarter||pj.quarters)) bk=normalize(pj); }
  }catch(e){}
  pendingBackup = bk && (bk.rev||0) > (state.rev||0) ? bk : null;

  if(MODE==="artifact" && !artifactApi) canSave=false;

  /* ?rep=<id or name> opens one rep's own calendar and nothing else */
  var want=null;
  try{ want=new URLSearchParams(location.search).get("rep"); }catch(e){}
  if(want){
    var hit=null;
    state.branches.forEach(function(b){
      b.reps.forEach(function(r){
        if(!hit && (r.id===want || r.name.toLowerCase()===want.toLowerCase())) hit={b:b,r:r};
      });
    });
    if(hit){ focusRepId=hit.r.id; ui.branch=hit.b.code; ui.repId=hit.r.id; ui.view="calendar"; }
    else focusMiss=want;
  }

  if(!state.branches.length){
    /* Opened straight from disk, or reached before the server answered: the page
       carries no roster of its own, so say that rather than render an empty shell. */
    document.body.innerHTML='<div style="padding:40px;font:14px system-ui;max-width:46ch;line-height:1.6">'
      +'<strong>No calendar data.</strong><br>This page holds none of its own — the roster and '
      +'availability come from the site it is served by. Open it from the deployed address rather '
      +'than as a file.</div>';
    return;
  }

  $("#repFilter").value=ui.filter||"";
  applyTheme(loadTheme());
  guardTheme();
  render();
  startPolling();

}

boot();
})();
</script>

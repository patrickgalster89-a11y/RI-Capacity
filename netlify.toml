# Deploying this repo as its own Netlify site.
#
# Only `capacity/` is published, so the calendar is the whole site and nothing
# else in the repo — package.json, the function source, these notes — is served
# to the public. The function is found through `functions` below, which is
# relative to the repo root, not to the publish directory.
#
# Dropping capacity/ and netlify/functions/ into an EXISTING site instead needs
# none of this file: the function declares its own route and netlify/functions
# is already Netlify's default location. See DEPLOY.md.

[build]
  publish = "capacity"
  functions = "netlify/functions"
  # No build step: the app is one self-contained file, committed as it ships.
  command = ""

[build.environment]
  # Pinned so a Netlify default change can't move the function's runtime.
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The app is one file; never let a browser hold a stale copy of it.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
